name: Nightly

# Slow, high-signal gates that never block a PR.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Registry references must be lowercase; the repo owner may not be.
      - name: Resolve the image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/internal-linktree:latest" >> "$GITHUB_OUTPUT"
      # No release tag has been pushed until the first `v*` tag — skip cleanly
      # instead of failing on a nonexistent image.
      - name: Check the image exists
        id: exists
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "${{ steps.image.outputs.ref }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no released image yet — skipping scan"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: aquasecurity/trivy-action@0.28.0
        if: steps.exists.outputs.found == 'true'
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
