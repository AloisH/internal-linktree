name: Release

# Tag v1.2.3 → push ghcr.io/<owner>/internal-linktree:{1.2.3, 1.2, latest}
# plus a GitHub Release with a conventional-commit changelog.
# Then pings the Dokploy deploy webhook (DOKPLOY_WEBHOOK_URL secret) so the
# VPS pulls the new :latest — the VPS never builds. Skipped while the secret
# is unset, so the first release can publish the image before Dokploy exists.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          MINOR=${VERSION%.*}
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          echo "tags=ghcr.io/$OWNER/internal-linktree:$VERSION,ghcr.io/$OWNER/internal-linktree:$MINOR,ghcr.io/$OWNER/internal-linktree:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy on Dokploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        if: env.DOKPLOY_WEBHOOK_URL != ''
        run: curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL"
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
