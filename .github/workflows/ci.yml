name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --check .
      - run: pnpm exec oxlint --deny-warnings
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec knip
      # nuxt build catches SSR-only breakage that lint/typecheck miss
      - run: pnpm build

  # Build the production image and boot it: the artifact that ships must start,
  # migrate its DB and answer the health check.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: internal-linktree:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot and probe
        run: |
          docker run -d --name app -p 3000:3000 \
            -e NUXT_AUTH_SECRET=ci-only-secret-ci-only-secret-ci-only \
            -e NUXT_ADMIN_EMAIL=admin@example.com -e NUXT_ADMIN_PASSWORD=ci-only-admin-password \
            internal-linktree:ci
          timeout 30 sh -c 'until curl -sf http://localhost:3000/api/health; do sleep 1; done'
          # Anonymous: the portal redirects to the login, the API refuses, OIDC discovery answers.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "302"
          curl -sf http://localhost:3000/login >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/admin/categories)" = "401"
          curl -sf http://localhost:3000/api/auth/.well-known/openid-configuration | grep -q '"authorization_endpoint"'
          # The seeded admin can sign in (Better Auth wants an Origin) and read the catalog.
          curl -sf -c cookies.txt -H 'origin: http://localhost:3000' -H 'content-type: application/json' \
            -d '{"email":"admin@example.com","password":"ci-only-admin-password"}' \
            http://localhost:3000/api/auth/sign-in/email >/dev/null
          curl -sf -b cookies.txt http://localhost:3000/api/catalog >/dev/null
          docker logs app

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
