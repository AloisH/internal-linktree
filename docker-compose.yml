# The real deployment stack. The image is pulled by tag from GHCR;
# deployment is `docker compose pull && docker compose up -d` (just deploy).
# Secrets come from .env next to this file — never commit it.
name: internal-linktree

services:
  app:
    image: ghcr.io/${GHCR_OWNER:?}/internal-linktree:${APP_TAG:-latest}
    environment:
      NUXT_AUTH_SECRET: ${NUXT_AUTH_SECRET:?}
      NUXT_ADMIN_EMAIL: ${NUXT_ADMIN_EMAIL:-}
      NUXT_ADMIN_PASSWORD: ${NUXT_ADMIN_PASSWORD:-}
      NUXT_PUBLIC_SIGNUP_EMAIL_DOMAIN: ${NUXT_PUBLIC_SIGNUP_EMAIL_DOMAIN:-}
      NUXT_PUBLIC_SITE_URL: https://${DOMAIN:?}
    volumes:
      - data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
